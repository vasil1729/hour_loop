name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'APK architecture: arm64 is smaller/faster, universal supports all ABIs'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - universal

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  gate:
    name: Check automatic release eligibility
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check out tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this tag is a major or minor release
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual release requested; publishing the current app version."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="${GITHUB_REF_NAME#v}"
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a three-part semver tag."
            exit 1
          fi

          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${current}$" \
            | head -n 1 || true)"

          if [[ -z "$previous" ]]; then
            echo "No previous semver tag; allowing the first automatic release."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r current_major current_minor current_patch <<< "$current"
          IFS=. read -r previous_major previous_minor previous_patch <<< "$previous"

          if [[ "$current_major" != "$previous_major" || "$current_minor" != "$previous_minor" ]]; then
            echo "Version $current changes major/minor from $previous; automatic release allowed."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Version $current only changes the patch from $previous. Automatic release skipped; run Android Release manually to publish a patch."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish versioned release
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Read app version
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid expo.version in app.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Hour Loop v$version"

      - name: Validate release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          echo "Release tag: $tag"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match app.json version $tag. Bump expo.version or push a matching tag."
              exit 1
            fi
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Manual releases must run from the main branch."
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases must be built from a commit on main."
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump expo.version in app.json first."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already exists on a different commit."
              exit 1
            fi
          fi

      - name: Resolve artifact names
        id: artifact
        run: |
          if [[ "${{ inputs.architecture }}" == "universal" ]]; then
            suffix="universal"
          else
            suffix="arm64"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Architecture suffix: $suffix"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build versioned APK
        env:
          APK_ARCH: ${{ inputs.architecture || 'arm64-v8a' }}
        run: npm run apk:local

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hour-loop-v${{ steps.version.outputs.version }}-${{ steps.artifact.outputs.suffix }}-apk
          path: builds/*
          if-no-files-found: error

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_SUFFIX: ${{ steps.artifact.outputs.suffix }}
          ARCHITECTURE: ${{ inputs.architecture || 'arm64-v8a' }}
        run: |
          tag="v${VERSION}"
          gh release create "$tag" \
            "builds/hour-loop-v${VERSION}-${ARCH_SUFFIX}.apk" \
            "builds/hour-loop-v${VERSION}-${ARCH_SUFFIX}.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hour Loop v${VERSION}" \
            --notes "Hour Loop v${VERSION} for Android (${ARCHITECTURE}).

          Install: download hour-loop-v${VERSION}-${ARCH_SUFFIX}.apk and allow installs from unknown sources.
          The APK is release-built and signed with the standard React Native debug keystore, so it is intended for direct sideloading and testing rather than Google Play distribution.
          Commit: ${GITHUB_SHA}"
