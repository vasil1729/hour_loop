name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare download
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/hour-loop.apk
          cd apk
          sha256sum hour-loop.apk > hour-loop.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hour-loop-android-apk
          path: apk/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            apk/hour-loop.apk \
            apk/hour-loop.apk.sha256 \
            --title "Hour Loop Android build ${GITHUB_RUN_NUMBER}" \
            --notes "Installable Android APK for Hour Loop. The APK is release-built and signed with the standard React Native debug keystore, so it is suitable for direct installation after enabling install-from-unknown-sources. It is not intended for Google Play distribution."
