name: Android APK

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'APK architecture: arm64 is smaller/faster, universal supports all ABIs'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - universal
      publish_release:
        description: 'Publish a versioned GitHub release for the app.json version'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Read app version
        id: version
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid expo.version in app.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Hour Loop v$version"

      - name: Resolve artifact names
        id: artifact
        run: |
          if [[ "${{ inputs.architecture }}" == "universal" ]]; then
            suffix="universal"
          else
            suffix="arm64"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Architecture suffix: $suffix"

      - name: Validate release target
        if: inputs.publish_release && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases can only be published from the main branch."
          exit 1

      - name: Check that release tag is free
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump expo.version in app.json first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Bump expo.version in app.json first."
            exit 1
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build versioned APK
        env:
          APK_ARCH: ${{ inputs.architecture }}
        run: npm run apk:local

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hour-loop-v${{ steps.version.outputs.version }}-${{ steps.artifact.outputs.suffix }}-apk
          path: builds/*
          if-no-files-found: error

      - name: Publish versioned GitHub release
        if: inputs.publish_release && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH_SUFFIX: ${{ steps.artifact.outputs.suffix }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          tag="v${VERSION}"
          gh release create "$tag" \
            "builds/hour-loop-v${VERSION}-${ARCH_SUFFIX}.apk" \
            "builds/hour-loop-v${VERSION}-${ARCH_SUFFIX}.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hour Loop v${VERSION}" \
            --notes "Hour Loop v${VERSION} for Android (${ARCHITECTURE}).

          Install: download hour-loop-v${VERSION}-${ARCH_SUFFIX}.apk and allow installs from unknown sources.
          The APK is release-built and signed with the standard React Native debug keystore, so it is intended for direct sideloading and testing rather than Google Play distribution.
          Commit: ${GITHUB_SHA}"
